<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f0e8">
    <title>Blog — Stories from Yesteryear | Retro Poshak</title>

    <!-- Base CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/blog.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,500&family=Dancing+Script:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>
<body>

    <!-- NAVBAR -->
    <div id="navbar-placeholder"></div>

    <!-- ============================================ -->
    <!-- BLOG HERO                                     -->
    <!-- ============================================ -->
    <section class="blog-hero">
        <div class="blog-hero-bg">
            <img src="assets/images/blog/blog-hero.jpg" alt="Children on a rooftop at sunset" loading="eager">
            <div class="blog-hero-overlay"></div>
        </div>

        <!-- Scattered polaroids (decorative) -->
        <div class="blog-hero-polaroids" aria-hidden="true">
            <div class="blog-polaroid blog-polaroid-1">
                <img src="assets/images/blog/polaroid-1.jpg" alt="" loading="lazy">
            </div>
            <div class="blog-polaroid blog-polaroid-2">
                <img src="assets/images/blog/polaroid-2.jpg" alt="" loading="lazy">
            </div>
            <div class="blog-polaroid blog-polaroid-3">
                <img src="assets/images/blog/polaroid-3.jpg" alt="" loading="lazy">
            </div>
        </div>

        <!-- Cursive note -->
        <div class="blog-hero-note" aria-hidden="true">
            Nostalgia<br>Lives Here.
        </div>

        <!-- Left content -->
        <div class="blog-hero-content">
            <span class="blog-hero-eyebrow">Our Blog</span>
            <h1 class="blog-hero-title">
                Stories<br>
                from<br>
                Yesteryear.
            </h1>
            <p class="blog-hero-script">
                Same streets.<br>
                Different generations.<br>
                Same feelings. <span class="heart">♡</span>
            </p>
        </div>

        <!-- Faint watermark -->
        <div class="blog-hero-watermark" aria-hidden="true">yaadein</div>
    </section>

    <!-- ============================================ -->
    <!-- CATEGORIES + SEARCH BAR                       -->
    <!-- ============================================ -->
    <section class="blog-toolbar">
        <div class="blog-toolbar-inner">
            <nav class="blog-categories" aria-label="Blog categories">
                <button class="blog-cat active" data-category="all">
                    <span>All Posts</span>
                    <span class="blog-cat-underline"></span>
                </button>
                <button class="blog-cat" data-category="childhood">
                    <span>Childhood</span>
                    <span class="blog-cat-underline"></span>
                </button>
                <button class="blog-cat" data-category="indian-streets">
                    <span>Indian Streets</span>
                    <span class="blog-cat-underline"></span>
                </button>
                <button class="blog-cat" data-category="people-places">
                    <span>People &amp; Places</span>
                    <span class="blog-cat-underline"></span>
                </button>
                <button class="blog-cat" data-category="vintage-things">
                    <span>Vintage Things</span>
                    <span class="blog-cat-underline"></span>
                </button>
                <button class="blog-cat" data-category="life-lessons">
                    <span>Life Lessons</span>
                    <span class="blog-cat-underline"></span>
                </button>
            </nav>

            <div class="blog-search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="text" id="blogSearchInput" placeholder="Search stories..." aria-label="Search blog posts">
                <button class="blog-search-clear" id="blogSearchClear" aria-label="Clear search" hidden>
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- ============================================ -->
    <!-- BLOG GRID                                     -->
    <!-- ============================================ -->
    <section class="blog-section">
        <div class="blog-container">
            <div class="blog-grid" id="blogGrid">
                <!-- Posts injected by blog.js -->
            </div>

            <!-- Empty state -->
            <div class="blog-empty" id="blogEmpty" hidden>
                <div class="blog-empty-icon">🔍</div>
                <h3>No stories found</h3>
                <p>Try a different category or search term.</p>
                <button class="blog-empty-reset" id="blogEmptyReset">Show all posts</button>
            </div>

            <!-- Load more -->
            <div class="blog-load-more-wrap">
                <button class="blog-load-more" id="blogLoadMore">
                    <span>Load More Stories</span>
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/blog.js"></script>
    <script>
        (async function () {
            await initNavbarAndFooter();
            initBlog();
        })();
    </script>
</body>
</html>
