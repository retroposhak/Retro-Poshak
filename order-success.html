<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - Retro Poshak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/auth.css">
     <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (icons) -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
    <style>
        .success-page { padding: 100px 20px; text-align: center; background: #f5f0e8; min-height: 70vh; display: flex; align-items: center; justify-content: center; }
        .success-card { max-width: 560px; background: #fff; border-radius: 20px; padding: 60px 40px; box-shadow: 0 20px 60px rgba(0,0,0,.08); }
        .success-icon { width: 90px; height: 90px; border-radius: 50%; background: rgba(44,122,74,.12); color: #2c7a4a; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; margin: 0 auto 24px; animation: pop .5s ease; }
        @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .success-card h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-style: italic; color: #1a1a1a; margin: 0 0 12px; }
        .success-card p { color: #7a7a7a; font-size: .92rem; line-height: 1.7; margin: 0 0 8px; }
        .success-order-id { font-weight: 600; color: #1a1a1a; font-size: 1.05rem; margin: 16px 0 24px; padding: 12px 20px; background: #f5f0e8; border-radius: 10px; display: inline-block; letter-spacing: 1px; }
        .success-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
        .success-btn { padding: 14px 28px; border-radius: 30px; font-size: .72rem; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 600; text-decoration: none; transition: all .3s; }
        .success-btn-primary { background: #1a1a1a; color: #f5f0e8; }
        .success-btn-primary:hover { background: #b33a3a; transform: translateY(-2px); }
        .success-btn-secondary { background: transparent; color: #1a1a1a; border: 1px solid rgba(0,0,0,.15); }
        .success-btn-secondary:hover { border-color: #b33a3a; color: #b33a3a; }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="success-page">
        <div class="success-card">
            <div class="success-icon">✓</div>
            <h1>Order Placed!</h1>
            <p>Thank you for shopping with Retro Poshak. Your order has been confirmed and will be shipped soon.</p>
            <div class="success-order-id" id="orderIdDisplay">Order #—</div>
            <p style="font-size:.82rem;">You'll receive an update on your registered email and phone.</p>

            <div class="success-actions">
                <a href="profile.html#orders" class="success-btn success-btn-primary">VIEW MY ORDERS</a>
                <a href="shop.html" class="success-btn success-btn-secondary">CONTINUE SHOPPING</a>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>
    <script>
        (async function () {
            await initNavbarAndFooter();
            const id = sessionStorage.getItem('lastOrderId');
            if (id) document.getElementById('orderIdDisplay').textContent = `Order #${id}`;
        })();
    </script>
</body>
</html>
