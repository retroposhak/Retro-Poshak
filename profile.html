<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Retro Poshak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/profile.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 (icons) -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main id="profile-app">
        <section class="profile-page">
            <div class="profile-container" id="profileContainer">
                <!-- Injected by profile.js -->
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        // ============================================
        // PROFILE PAGE INIT
        // 1. Render the profile FIRST (so it's visible
        //    even if the navbar fails to load)
        // 2. Then load the navbar in the background
        // ============================================
        (async function initPage() {
            // ⭐ Render profile immediately — don't wait for navbar
            try {
                if (typeof renderProfile === 'function') {
                    renderProfile();
                } else {
                    console.error('renderProfile is not defined — check js/profile.js');
                }
            } catch (err) {
                console.error('Failed to render profile:', err);
            }

            // ⭐ Load navbar + footer in parallel (or sequentially)
            try {
                if (typeof initNavbarAndFooter === 'function') {
                    await initNavbarAndFooter();
                }
            } catch (err) {
                console.error('Failed to init navbar/footer:', err);
            }
        })();
    </script>

</body>
</html>
