<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Retro Poshak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/shop.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous"
          referrerpolicy="no-referrer">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main id="shop-app">
        <!-- Content injected by shop.js -->
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/main.js"></script>
    <script src="js/navbar.js"></script>

    <script>
        // ============================================
        // Load navbar + footer, THEN init ALL navbar features
        // ============================================
        (async function initPage() {
            try {
                // ✅ Use the shared initializer (which now includes
                // the 60ms tick that fixes the hamburger on mobile)
                if (typeof initNavbarAndFooter === 'function') {
                    await initNavbarAndFooter();
                } else {
                    // Fallback (shouldn't be needed)
                    const [navRes, footRes] = await Promise.all([
                        fetch('components/navbar.html'),
                        fetch('components/footer.html')
                    ]);
                    document.getElementById('navbar-placeholder').innerHTML = await navRes.text();
                    document.getElementById('footer-placeholder').innerHTML = await footRes.text();
                    await new Promise(r => setTimeout(r, 60));
                    if (typeof initMobileMenu === 'function') initMobileMenu();
                    if (typeof initSearch === 'function') initSearch();
                    if (typeof initProfileDropdown === 'function') initProfileDropdown();
                }

                if (typeof updateCartBadge === 'function') updateCartBadge();
                if (typeof updateWishlistBadge === 'function') updateWishlistBadge();
            } catch (err) {
                console.error('Failed to init page:', err);
            }
        })();
    </script>

</body>
</html>
