<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Retro Poshak</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main id="shop-app">
        <!-- Content injected by shop.js (product detail OR shop grid) -->
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/data.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/main.js"></script>
    <script>
        // ============================================
        // Load navbar + footer, THEN init navbar features
        // ============================================
        (async function initPage() {
            try {
                const [navRes, footRes] = await Promise.all([
                    fetch('components/navbar.html'),
                    fetch('components/footer.html')
                ]);

                document.getElementById('navbar-placeholder').innerHTML = await navRes.text();
                document.getElementById('footer-placeholder').innerHTML = await footRes.text();

                // Wait for main.js functions to exist
                if (typeof initMobileMenu === 'function') initMobileMenu();
                if (typeof initSearch === 'function') initSearch();
            } catch (err) {
                console.error('Failed to load navbar/footer:', err);
            }
        })();
    </script>
</body>
</html>
